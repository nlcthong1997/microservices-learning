version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: local_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # 2. Apache Kafka (KRaft mode)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: local_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SUPER_EXTERNAL:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,SUPER_EXTERNAL://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,SUPER_EXTERNAL://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  # Giao diện Web UI quản trị trực quan cho Kafka (THÊM MỚI Ở ĐÂY)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: local_kafka_ui
    ports:
      - "8080:8080" # Cổng vào giao diện Web UI của Kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092 # Chỉ đường cho UI kết nối vào con Kafka ở trên

  # 3. Hệ thống Logs tập trung (Loki & Grafana)
  loki:
    image: grafana/loki:2.9.0
    container_name: local_loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:10.2.0
    container_name: local_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  # 4. PostgreSQL — Database của inventory-service
  #    Mỗi service sở hữu DB riêng (Database per Service pattern)
  #    Không service nào khác được kết nối trực tiếp vào DB này
  # 5. Microsoft SQL Server 2022 — học về RDBMS enterprise và query optimization
  #    Port: 1433 (mặc định của SQL Server)
  #    Tool kết nối: Azure Data Studio, DBeaver, hoặc sqlcmd
  #    Connection string: Server=localhost,1433;Database=learning_db;User=sa;Password=YourStr0ng!Pass
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: local_sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStr0ng!Pass"
      MSSQL_PID: "Developer"       # bản Developer — miễn phí, đầy đủ tính năng Enterprise
    volumes:
      - sqlserver_data:/var/opt/mssql  # persist data giữa các lần restart
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStr0ng!Pass' -Q 'SELECT 1' -No -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s             # SQL Server khởi động chậm hơn Postgres

  postgres:
    image: postgres:16-alpine
    container_name: local_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
      POSTGRES_DB: inventory_db
    volumes:
      - ./inventory-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sqlserver_data: